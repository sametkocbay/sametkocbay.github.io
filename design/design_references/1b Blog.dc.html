<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b0d12;color:#e8eaf0;font-family:'Space Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#e8eaf0;text-decoration:none}
a:hover{color:#6ee7dc}
::selection{background:rgba(110,231,220,.25)}
</style>
</helmet>
<nav style="position:sticky;top:0;z-index:50;border-bottom:1px solid rgba(110,231,220,.14);background:rgba(11,13,18,.92);backdrop-filter:blur(10px)">
  <div style="margin:0 auto;max-width:1280px;padding:0 40px;display:flex;height:60px;align-items:center;justify-content:space-between;gap:16px">
    <a href="1b Home.dc.html" style="font:600 13px 'IBM Plex Mono',monospace;white-space:nowrap"><span style="color:#6ee7dc">~/</span>samet-kocbay</a>
    <div style="display:flex;gap:26px;font:400 12.5px 'IBM Plex Mono',monospace">
      <a href="1b Home.dc.html" style="color:#8b93a5">index</a>
      <a href="1b Projects.dc.html" style="color:#8b93a5">projects</a>
      <a href="1b Blog.dc.html" style="color:#6ee7dc">blog</a>
      <a href="1b Home.dc.html#experience" style="color:#8b93a5">experience</a>
    </div>
    <a href="uploads/cv.pdf" style="font:500 11.5px 'IBM Plex Mono',monospace;border:1px solid rgba(110,231,220,.5);color:#6ee7dc;padding:7px 14px;border-radius:4px;white-space:nowrap" style-hover="background:rgba(110,231,220,.08)">cv.pdf ↓</a>
  </div>
</nav>
<main style="margin:0 auto;max-width:860px;padding:0 40px 80px">
  <header style="padding:64px 0 32px;border-bottom:1px solid rgba(139,147,165,.22)">
    <p style="margin:0;font:400 12px 'IBM Plex Mono',monospace;color:#6ee7dc">cat blog.log | sort -r</p>
    <h1 style="margin:12px 0 0;font-size:44px;font-weight:700;letter-spacing:-.02em;color:#e8eaf0">Notes</h1>
    <p style="margin:12px 0 0;font:400 14px/1.6 'IBM Plex Mono',monospace;color:#8b93a5;max-width:600px">Working notes on scientific ML, numerics, and HPC — written as I go.</p>
  </header>
  <div style="display:flex;flex-direction:column">
    <sc-for list="{{ posts }}" as="p" hint-placeholder-count="4">
      <a href="{{ p.href }}" style="display:grid;grid-template-columns:120px 1fr auto;gap:24px;align-items:baseline;padding:26px 4px;border-bottom:1px solid rgba(139,147,165,.15)" style-hover="background:rgba(110,231,220,.03)">
        <span style="font:400 11.5px 'IBM Plex Mono',monospace;color:#465064">{{ p.date }}</span>
        <span>
          <span style="display:block;font:600 19px/1.3 'Space Grotesk',sans-serif;color:#e8eaf0">{{ p.title }}</span>
          <span style="display:block;margin-top:6px;font:400 12.5px/1.6 'IBM Plex Mono',monospace;color:#8b93a5">{{ p.summary }}</span>
        </span>
        <span style="font:400 11px 'IBM Plex Mono',monospace;color:#6ee7dc;white-space:nowrap">{{ p.tag }}</span>
      </a>
    </sc-for>
  </div>
  <p style="margin:32px 0 0;font:400 12px 'IBM Plex Mono',monospace;color:#465064">— end of log. —</p>
</main>
<footer style="border-top:1px solid rgba(110,231,220,.14)">
  <div style="margin:0 auto;max-width:1280px;padding:32px 40px;display:flex;align-items:center;justify-content:space-between;gap:16px;font:400 12px 'IBM Plex Mono',monospace;color:#465064">
    <p style="margin:0">© 2026 samet kocbay · munich</p>
    <div style="display:flex;gap:20px">
      <a href="https://github.com/sametkocbay" style="color:#465064" style-hover="color:#6ee7dc">github</a>
      <a href="https://www.linkedin.com/in/samet-kocbay/" style="color:#465064" style-hover="color:#6ee7dc">linkedin</a>
      <a href="mailto:samet.kocbay@tum.de" style="color:#465064" style-hover="color:#6ee7dc">email</a>
    </div>
  </div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      posts: [
        { date: '2026-05-02', title: 'Barnes–Hut in C++: OpenMP/AVX-512 vs MPI', summary: 'Two parallelization strategies for the same N-body solver: task-based octree construction with vectorized force kernels vs Morton-curve domain decomposition.', tag: 'hpc', href: '1b Post Barnes-Hut.dc.html' }
      ]
    };
  }
}
</script>
</body>
</html>
